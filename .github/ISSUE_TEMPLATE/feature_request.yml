name: Feature request
description: Suggest an idea or improvement.
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like?
      description: The problem it solves, or what it would let you do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?

name: Setup Android Gradle Environment
description: Sets up JDK 21, optional Android Lint cache, and Gradle User Home / Build Cache.

inputs:
  job-key:
    description: Cache key namespace for this CI job
    required: true
  cache-read-only:
    description: Override cache-read-only for Gradle User Home ("true" or "false"; defaults to read-only off main)
    required: false
    default: ""
  cache-android-lint:
    description: Persist ~/.android/cache for Android Lint across runs
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    # Registered before setup-gradle so post-step reverse order stops the Gradle daemon
    # before actions/cache archives ~/.android/cache.
    - name: Cache Android Lint cache
      if: inputs.cache-android-lint == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.android/cache
        key: ${{ runner.os }}-android-lint-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-android-lint-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: enhanced
        # Keep shared dependencies/transforms intact across parallel debug, test, lint, and release jobs.
        cache-cleanup: never
        cache-read-only: ${{ inputs.cache-read-only != '' && inputs.cache-read-only == 'true' || github.ref != 'refs/heads/main' }}

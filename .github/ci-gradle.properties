# CI-only Gradle settings. The setup action copies this file to ~/.gradle/gradle.properties, which takes precedence over
# the project's gradle.properties, so local builds keep their own (smaller) defaults.

# Hosted runners have 4 vCPUs and 16 GB. R8 is memory-bound: on this app it runs ~13% faster at 6 GB than at 4 GB, and
# no faster at 8 GB. The Kotlin daemon gets 2 GB, which leaves room for the OS, the lint and test workers.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# Every CI build starts from a fresh checkout: incremental-compilation bookkeeping and file watching only cost time there.
kotlin.incremental=false
org.gradle.vfs.watch=false

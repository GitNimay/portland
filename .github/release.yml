changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: "🔒 Security"
      labels:
        - type/security
        - area/security
    - title: "🚀 Features"
      labels:
        - type/feature
        - enhancement
    - title: "⚡ Performance"
      labels:
        - type/perf
    - title: "🐛 Bug Fixes"
      labels:
        - type/bug
        - bug
    - title: "🎨 UI & Media"
      labels:
        - area/ui
        - area/media
    - title: "🌐 Website"
      labels:
        - area/website
    - title: "☁️ Sync & Data"
      labels:
        - area/sync-r2
        - area/data
    - title: "🧰 CI/CD & Build"
      labels:
        - type/ci
        - area/ci-cd
        - area/build
        - area/tests
    - title: "📦 Dependencies"
      labels:
        - type/deps
        - dependencies
    - title: "📝 Documentation"
      labels:
        - type/docs
        - area/docs
        - documentation
    - title: "🔄 Other Changes"
      labels:
        - "*"

name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a release halfway through publishing; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # No secrets here: the app builds in local-only mode, so PRs from anywhere are safe to run.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # GitHub release
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      AI_TOKEN: ${{ secrets.AI_TOKEN }}
      RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
      RELEASE_ALIAS: ${{ secrets.RELEASE_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Version and signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          # +100 keeps every CI build above local builds (versionCode 1).
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: ./gradlew :app:assembleRelease

      - name: Publish to R2
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          key="releases/portland-$VERSION_CODE.apk"
          put() {
            curl -fsS --aws-sigv4 "aws:amz:auto:s3" --user "$R2_ACCESS_KEY:$R2_SECRET_KEY" \
              -H "Content-Type: $3" -T "$1" "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com/$R2_BUCKET/$2"
          }
          put "$apk" "$key" application/vnd.android.package-archive
          jq -n --argjson code "$VERSION_CODE" --arg name "1.0.$VERSION_CODE" --arg apk "$key" \
            --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" --arg notes "$(git log -1 --pretty=%s)" \
            '{versionCode: $code, versionName: $name, apk: $apk, sha256: $sha, notes: $notes}' > latest.json
          # The pointer goes last, so installed apps only ever see a fully uploaded build.
          put latest.json releases/latest.json application/json
          # shortcut: old releases/portland-*.apk are kept (~4.5 MB each); prune them once the bucket nears the 10 GB free tier.

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$VERSION_CODE" app/build/outputs/apk/release/app-release.apk \
            --title "Portland 1.0.$VERSION_CODE" --target "$GITHUB_SHA" --generate-notes

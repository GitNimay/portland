name: Android

# Pull requests fan out to four parallel runners (unit tests, lint, debug APK, R8 release check), all restoring main's
# Gradle cache read-only. On main, one `verify` job runs the three debug checks in a single Gradle invocation, which
# compiles once and is the only job that writes the cache, while the signed release builds next to it; publish waits
# for both.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # Never cancel a release halfway through publishing; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Pull requests ────────────────────────────────────────────────────────────────────────────────────────────────
  # Job names are required status checks on main; keep them stable.

  unit-tests:
    name: Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-gradle

      # A manifest from the release script, so ReleaseTest proves the app parses exactly what CI publishes.
      - name: Sample update manifest
        run: |
          printf 'sample' > "$RUNNER_TEMP/sample.apk"
          bash .github/scripts/release-manifest.sh "$RUNNER_TEMP/sample.apk" 100 1.0.100 "$GITHUB_REPOSITORY" "$RUNNER_TEMP/manifests"
          echo "PORTLAND_RELEASE_MANIFEST=$RUNNER_TEMP/manifests/latest.json" >> "$GITHUB_ENV"

      # No secrets here: runs JVM unit tests in local-only mode (R2LiveTest skips itself).
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Fork PRs get a read-only token and cannot create check runs.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          name: Unit Test Results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test report on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    name: Android Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-gradle
        with:
          cache-android-lint: "true"

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  build-debug:
    name: Debug Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-gradle

      # No secrets here: builds in local-only mode, verifying packaging and resources.
      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  release-check:
    name: Release Build Check
    # Builds the shrunk (R8) release APK with no secrets (debug-signed, local-only), so a shrinker or resource problem
    # shows on the PR rather than in the release job after merge, and records the APK and dex sizes so a change's
    # effect on them is visible before it ships.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android-gradle

      # The parallel lint job already runs the full lintDebug.
      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      # The same manifest script and checks the publish job runs, on this PR's APK, so a broken update path fails here.
      - name: Check update manifest
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bash .github/scripts/release-manifest.sh "$apk" 100 1.0.100 "$GITHUB_REPOSITORY" "$RUNNER_TEMP/manifests" "PR check"
          bash .github/scripts/check-release-manifest.sh "$apk" "$RUNNER_TEMP/manifests"

      - name: Write size summary
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          {
            echo "### Release APK size"
            echo "| File | Bytes |"
            echo "|---|---:|"
            echo "| app-release.apk | $(stat -c %s "$apk") |"
            unzip -lv "$apk" | awk '$8 ~ /^classes[0-9]*\.dex$/ { print "| " $8 " | " $1 " |" }'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── main ─────────────────────────────────────────────────────────────────────────────────────────────────────────

  verify:
    name: Verify (tests, lint, debug APK)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The one cache writer: it resolves every debug, test and lint dependency, so the PR jobs restore a complete home.
      - uses: ./.github/actions/setup-android-gradle
        with:
          cache-write: "true"
          cache-android-lint: "true"

      - name: Sample update manifest
        run: |
          printf 'sample' > "$RUNNER_TEMP/sample.apk"
          bash .github/scripts/release-manifest.sh "$RUNNER_TEMP/sample.apk" 100 1.0.100 "$GITHUB_REPOSITORY" "$RUNNER_TEMP/manifests"
          echo "PORTLAND_RELEASE_MANIFEST=$RUNNER_TEMP/manifests/latest.json" >> "$GITHUB_ENV"

      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --continue --stacktrace

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ !cancelled() }}
        with:
          name: Unit Test Results
          path: app/build/test-results/testDebugUnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verify-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
          retention-days: 7

  build-release:
    name: Build Release APK
    # Runs in parallel with verify on main; publish gates on both.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version_code: ${{ steps.meta.outputs.version_code }}
      version_name: ${{ steps.meta.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read-only: this build runs with the release signing key, so its outputs must never reach the Actions cache,
      # which fork pull requests can restore. (No cloud keys are built in: users connect their own R2 in the app.)
      - uses: ./.github/actions/setup-android-gradle

      - name: Version and signing key
        id: meta
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          # +100 keeps every CI build above local builds (versionCode 1).
          code=$((GITHUB_RUN_NUMBER + 100))
          name="1.0.$code"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "version_name=$name" >> "$GITHUB_OUTPUT"
          printf '%s' "$KEYSTORE" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Secrets are scoped to the one step that needs them. lintVitalRelease is skipped: verify runs the full lintDebug.
      - name: Assemble Release APK
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.RELEASE_ALIAS }}
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace

      - name: Stage release artifacts
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/dist/"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/dist/
          retention-days: 1

  dependency-graph:
    name: Dependency Graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: ci1-
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: android
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: android
        with:
          cache-provider: enhanced
          # Resolves every configuration; writing that superset would add a second ~600 MB dependencies entry.
          cache-read-only: true

  publish:
    name: Publish Release
    needs: [verify, build-release]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write # GitHub release
      id-token: write # build provenance attestation
      attestations: write
    env:
      VERSION_CODE: ${{ needs.build-release.outputs.version_code }}
      VERSION_NAME: ${{ needs.build-release.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-artifacts

      # Signed SLSA provenance for the APK: `gh attestation verify app-release.apk -R <owner>/<repo>` proves it was
      # built by this workflow from this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/app-release.apk

      # The same script and check every PR's release build runs.
      - name: Update manifest
        run: |
          apk=release-artifacts/app-release.apk
          sha=$(bash .github/scripts/release-manifest.sh "$apk" "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/manifests" "$(git log -1 --pretty=%s)")
          bash .github/scripts/check-release-manifest.sh "$apk" "$RUNNER_TEMP/manifests"
          cp "$RUNNER_TEMP/manifests/latest.json" release-artifacts/latest.json
          echo "APK_SHA256=$sha" >> "$GITHUB_ENV"

      # The in-app updater reads releases/latest/download/latest.json, so the manifest ships in the same release as
      # the APK. gh uploads every asset before it publishes the release, so apps never see half a release, and
      # --latest makes sure that URL points at this one.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("release-artifacts/app-release.apk" "release-artifacts/latest.json")
          if [ -f release-artifacts/mapping.txt ]; then
            assets+=("release-artifacts/mapping.txt")
          fi
          gh release create "v$VERSION_NAME" "${assets[@]}" \
            --title "Portland $VERSION_NAME" --target "$GITHUB_SHA" --generate-notes --latest

      - name: Write release summary
        run: |
          {
            echo "### Published Portland $VERSION_NAME"
            echo "- **versionCode:** \`$VERSION_CODE\`"
            echo "- **SHA-256:** \`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

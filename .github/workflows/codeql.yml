name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the Android workflow's Gradle cache read-only.
      - uses: ./.github/actions/setup-android-gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

      # Trace Kotlin/Java compilation only; skip APK packaging, resource merging, and dexing.
      # --no-daemon ensures CodeQL intercepts all compiler invocations; GRADLE_OPTS preserves heap sizing.
      - name: Build Kotlin & Java for CodeQL
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
        run: ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac --no-daemon --no-build-cache --no-configuration-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          # SARIF upload to the Security tab requires a public repo or GitHub Code Security / GHAS.
          upload: ${{ (github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true') && 'always' || 'never' }}

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          retention-days: 14

      - name: Summarize & enforce CodeQL findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, os, sys

          files = sorted(glob.glob("sarif-results/*.sarif"))
          if not files:
              print("::error::No CodeQL SARIF output found.")
              sys.exit(1)

          findings = []
          for path in files:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              for run in data.get("runs", []):
                  rules = {
                      r["id"]: r
                      for r in run.get("tool", {}).get("driver", {}).get("rules", [])
                  }
                  for res in run.get("results", []):
                      rule_id = res.get("ruleId", "unknown")
                      level = res.get("level") or rules.get(rule_id, {}).get("defaultConfiguration", {}).get("level", "warning")
                      msg = res.get("message", {}).get("text", "").replace("\n", " ")
                      loc = ""
                      locs = res.get("locations", [])
                      if locs:
                          phys = locs[0].get("physicalLocation", {})
                          uri = phys.get("artifactLocation", {}).get("uri", "")
                          line = phys.get("region", {}).get("startLine", "")
                          loc = f"{uri}:{line}" if line else uri
                      findings.append((level, rule_id, loc, msg))

          errors = [f for f in findings if f[0] == "error"]
          warnings = [f for f in findings if f[0] == "warning"]
          notes = [f for f in findings if f[0] not in ("error", "warning")]

          lines = [
              "### CodeQL Analysis Summary",
              f"- **Errors:** {len(errors)} | **Warnings:** {len(warnings)} | **Notes:** {len(notes)}",
              "",
          ]
          if findings:
              lines += ["| Level | Rule | Location | Message |", "| --- | --- | --- | --- |"]
              for level, rule_id, loc, msg in findings[:50]:
                  safe_msg = msg.replace("|", "\\|")
                  lines.append(f"| `{level}` | `{rule_id}` | `{loc}` | {safe_msg} |")
          else:
              lines.append("No alerts found.")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write("\n".join(lines) + "\n")

          for level, rule_id, loc, msg in findings:
              tag = "error" if level == "error" else "warning"
              print(f"::{tag}::{rule_id} ({loc}): {msg}")

          if errors:
              sys.exit(1)
          PY

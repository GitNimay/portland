name: Security

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p ~/.local/bin
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C ~/.local/bin gitleaks

      # Pull requests scan only their own commits and pushes only the pushed range, so a finding already on main does
      # not fail every unrelated PR. The weekly schedule (and manual runs) re-audit the whole history.
      - name: Run Gitleaks secret scan
        id: scan
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          range=()
          if [ "$EVENT" = pull_request ]; then
            range=(--log-opts "$PR_BASE..$PR_HEAD")
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range=(--log-opts "$PUSH_BEFORE..$GITHUB_SHA")
          fi
          ~/.local/bin/gitleaks git --verbose --redact --config .gitleaks.toml "${range[@]}" \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Enforce Gitleaks result
        if: steps.scan.outcome != 'success'
        run: exit 1

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache: "true"
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Summarize & enforce Trivy findings
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open("trivy-results.sarif", encoding="utf-8") as f:
              data = json.load(f)

          findings = []
          for run in data.get("runs", []):
              for res in run.get("results", []):
                  rule_id = res.get("ruleId", "unknown")
                  level = res.get("level", "warning")
                  msg = res.get("message", {}).get("text", "").replace("\n", " ")
                  loc = ""
                  locs = res.get("locations", [])
                  if locs:
                      uri = locs[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
                      line = locs[0].get("physicalLocation", {}).get("region", {}).get("startLine", "")
                      loc = f"{uri}:{line}" if line else uri
                  findings.append((level, rule_id, loc, msg))

          lines = [
              "### Trivy Security Summary (CRITICAL/HIGH, fixable)",
              f"- **Findings:** {len(findings)}",
              "",
          ]
          if findings:
              lines += ["| Level | Rule | Location | Message |", "| --- | --- | --- | --- |"]
              for level, rule_id, loc, msg in findings[:50]:
                  safe_msg = msg[:160].replace("|", "\\|")
                  lines.append(f"| `{level}` | `{rule_id}` | `{loc}` | {safe_msg} |")
          else:
              lines.append("No CRITICAL or HIGH fixable findings detected.")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write("\n".join(lines) + "\n")

          if findings:
              for level, rule_id, loc, msg in findings:
                  print(f"::error::{rule_id} ({loc}): {msg}")
              sys.exit(1)
          PY

  osv-pr:
    name: OSV-Scanner (PR)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: true
      upload-sarif: true

  osv-full:
    name: OSV-Scanner (Full)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: true
      upload-sarif: true

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/actions/setup-website/**"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/actions/setup-website/**"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: website

env:
  CI: true

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website
      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website
      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website
      - name: Run tsc
        run: npm run typecheck

  unit-tests:
    # Distinct from Android's "Unit Tests", which is a required check on main.
    name: Website Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website

      - name: Run Vitest with coverage
        run: npm run test:coverage

      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # Fork PRs get a read-only token and cannot create check runs.
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Website Unit Test Results
          path: website/test-results/unit-junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Write coverage summary
        if: ${{ !cancelled() }}
        run: |
          node - <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const t = require('./coverage/coverage-summary.json').total
          const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`
          console.log(['### Website coverage', '| Metric | % | Covered |', '|---|---:|---:|',
            ...['lines', 'statements', 'functions', 'branches'].map(row)].join('\n'))
          JS

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: website-coverage
          path: website/coverage/
          retention-days: 7

  build:
    name: Website Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website

      - name: Build production bundle
        run: npm run build

      - name: Write size summary
        run: |
          {
            echo "### Website bundle size"
            echo "| File | Bytes | Gzip |"
            echo "|---|---:|---:|"
            find dist/client/assets -type f \( -name '*.js' -o -name '*.css' \) | sort | while read -r f; do
              echo "| ${f#dist/client/} | $(stat -c %s "$f") | $(gzip -c "$f" | wc -c) |"
            done
            echo "| **Total (JS + CSS)** | $(cat dist/client/assets/*.js dist/client/assets/*.css | wc -c) | $(cat dist/client/assets/*.js dist/client/assets/*.css | gzip -c | wc -c) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist/
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('website/package-lock.json') }}

      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run end-to-end tests
        run: npx playwright test --project=${{ matrix.project }} --grep-invert @a11y

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 7

  accessibility:
    name: Accessibility (axe)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-website

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('website/package-lock.json') }}

      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run WCAG 2.2 AA checks
        run: npx playwright test --project=chromium --project=mobile-chrome --grep @a11y

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-a11y
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 7

  website-ci:
    name: Website CI
    # One stable check to require in branch protection, whatever jobs sit behind it.
    if: always()
    needs: [format, lint, typecheck, unit-tests, build, e2e, accessibility]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Require every website job to pass
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A website job did not succeed ($r)."; exit 1; }
          done
